id = "zenith_engine"
name = "Zenith Engine"
version = "0.0.1"
description = "Prototype: extra shader passes for Zenith beyond the Horizon Shader API limits"
authors = ["scomicon"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins.
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "f1bb66f353cf67f2aa4665293fc75c8d91186fc7"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# Ask the renderer to keep the world's depth for world_drawn.
[[native.mixin]]
id = "needs"
target = "horizon_mod_render::render::render_needs"
kind = "HEAD"
helper = "src/mixins/needs.rs"
bindings = [{ name = "needs", ty = "&mut RenderNeeds", value = "needs" }]

# The engine's own passes, after the world (and the shader pack) is drawn.
[[native.mixin]]
id = "passes"
target = "horizon_mod_render::render::world_drawn"
kind = "HEAD"
helper = "src/mixins/passes.rs"
bindings = [{ name = "world", ty = "&mut WorldDrawn<'_>", value = "world" }]
